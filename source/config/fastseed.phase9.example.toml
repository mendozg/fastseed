# BSTY-FastSeed Phase 9 production baseline
[dns]
zone = "seed.globalboost.info"
listen_address = "0.0.0.0"
listen_port = 53
ttl_seconds = 60
max_answers = 32
include_warm = true
max_response_size = 1232

[dns.rate_limit]
per_source_per_second = 100
global_per_second = 5000
max_sources = 4096

[crawler]
max_concurrent_probes = 256
connect_timeout_ms = 1500
handshake_timeout_ms = 2500

[crawler.cooldown]
initial_seconds = 30
maximum_seconds = 3600
backoff_multiplier = 2.0

[cache]
hot_ipv4 = 1000
hot_ipv6 = 500
warm_max = 10000
cold_max = 50000

[health]
minimum_observations_for_hot = 3
freshness_seconds = 1800
quarantine_seconds = 3600

[health.latency]
history_size = 32

[database]
path = "fastseed.sqlite3"
max_peers = 250000
stale_days = 30
failed_days = 14
busy_timeout_ms = 2500

[database.persistence]
max_items = 10000
batch_size = 128
flush_interval_ms = 500

[federation]
enabled = false
seeder_id = "CHANGE-ME"
shared_secret = "CHANGE-ME"
clock_skew_seconds = 120
replay_window_seconds = 300
max_peers_per_message = 256
max_message_size = 65536
