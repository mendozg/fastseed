[network]
network = "mainnet"
p2p_port = 8226

[crawler]
max_concurrent_probes = 256
connect_timeout_ms = 1500
handshake_timeout_ms = 2500

[crawler.cooldown]
initial_seconds = 30
maximum_seconds = 3600
backoff_multiplier = 2.0

[limits]
max_open_connections = 2048
max_candidates = 100000

[bootstrap]
dns_seeds = [
  "seeder.globalboost.info",
  "seeder2.globalboost.info",
  "seeder3.globalboost.info",
  "dnsseed.globalboost.cc",
]

[cache]
hot_ipv4 = 1000
hot_ipv6 = 500
warm_max = 10000
cold_max = 50000

[health]
minimum_observations_for_hot = 3
freshness_seconds = 1800
quarantine_seconds = 3600
quarantine_after_failures = 3
cooldown_initial_seconds = 30
cooldown_max_seconds = 3600
cooldown_multiplier = 2.0

[health.latency]
history_size = 32

[database]
path = "fastseed.sqlite3"
max_peers = 250000
stale_days = 30
failed_days = 14
busy_timeout_ms = 2500

[database.persistence]
max_items = 10000
batch_size = 128
flush_interval_ms = 500

[dns]
zone = "seed.globalboost.info"
listen_address = "0.0.0.0"
listen_port = 53
ttl_seconds = 60
max_answers = 32
include_warm = true
refresh_interval_seconds = 60
