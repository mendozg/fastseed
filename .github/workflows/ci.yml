name: Build, test and package

on:
  push:
    branches: [main, 'feature/v2-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastseed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.gate }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        gate: [release, sanitizer]
    env:
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev libssl-dev libsqlite3-dev python3 dnsutils
      - name: Prepare private test directory and record environment
        run: |
          echo "TMPDIR=$(mktemp -d "$RUNNER_TEMP/fastseed.XXXXXX")" >> "$GITHUB_ENV"
          mkdir -p ci-results
          {
            cat /etc/os-release
            c++ --version
            cmake --version
            dpkg-query -W libboost-dev libssl-dev libsqlite3-dev
            git rev-parse HEAD
          } > ci-results/environment.txt
      - name: Verify source integrity
        run: python3 source/scripts/verify-source.py
      - name: Release gate
        if: matrix.gate == 'release'
        run: bash scripts/release-gate.sh
      - name: Sanitizer gate
        if: matrix.gate == 'sanitizer'
        run: bash scripts/sanitizer-gate.sh
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}-${{ matrix.gate }}
          retention-days: 30
          path: |
            ci-results/
            source/verification-results/
            source/build-release/Testing/Temporary/
            source/build-sanitizers/Testing/Temporary/

  package:
    name: Package verified source
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_TAG" = true ]; then
            test "$TAG" = "v$(tr -d '\r\n' < source/release/VERSION)"
          fi
      - name: Create source archives and SHA-256 hashes
        run: python3 .github/scripts/package-source.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft release
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recreate archives from the tested commit
        run: python3 .github/scripts/package-source.py --output dist
      - name: Create draft with source assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --draft \
            "${release_flags[@]}" --title "BSTY-FastSeed $TAG" --notes-file .github/RELEASE-TEMPLATE.md
